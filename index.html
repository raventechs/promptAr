<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generador de Prompts - RavenTechs</title>
<meta name="theme-color" content="#1ABC9C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PromptAR">
<link rel="manifest" href="manifest.json">
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: #0f1115;
    color: #e8e8e8;
    margin: 0;
    padding: 20px;
    min-height: 100vh;
  }
  .container { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 22px; color: #f5a623; }
  textarea {
    width: 100%;
    min-height: 110px;
    background: #1a1d23;
    color: #fff;
    border: 1px solid #333;
    border-radius: 10px;
    padding: 14px;
    font-size: 16px;
    resize: vertical;
  }
  button {
    margin-top: 12px;
    background: #f5a623;
    color: #111;
    border: none;
    padding: 14px 24px;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
  }
  button:disabled { opacity: 0.5; }
  .resultado {
    margin-top: 24px;
    background: #1a1d23;
    border-radius: 10px;
    padding: 18px;
    display: none;
  }
  .resultado h3 { color: #f5a623; margin-top: 0; }
  .prompt-box {
    background: #0f1115;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 14px;
    white-space: pre-wrap;
    font-size: 14px;
    line-height: 1.5;
  }
  .copiar {
    margin-top: 10px;
    background: #2a2d34;
    color: #fff;
    width: auto;
    padding: 8px 16px;
    font-size: 13px;
  }
  .mermaid { background: #fff; border-radius: 8px; padding: 10px; margin-top: 14px; }
  .loading { text-align: center; color: #999; margin-top: 14px; }
</style>
</head>
<body>
<div class="container">
  <h1>⚡ Generador de Prompts</h1>
  <p>Escribí tu idea en palabras simples. La IA la transforma en un prompt detallado y listo para usar.</p>
  <textarea id="idea" placeholder="Ej: una app para que un kiosco controle el stock y avise cuando falta mercadería..."></textarea>
  <button id="btnGenerar" onclick="generar()">Generar Prompt</button>

  <div class="loading" id="loading" style="display:none;">Generando...</div>

  <div class="resultado" id="resultado">
    <h3>📋 Prompt</h3>
    <div class="prompt-box" id="promptTexto"></div>
    <button class="copiar" onclick="copiar()">Copiar prompt</button>

    <h3 style="margin-top:20px;">💡 Consejo</h3>
    <div id="consejoTexto"></div>

    <h3 style="margin-top:20px;">🔁 Diagrama de pasos</h3>
    <div class="mermaid" id="diagrama"></div>
  </div>
</div>

<script>
mermaid.initialize({ startOnLoad: false });

async function generar() {
  const idea = document.getElementById('idea').value.trim();
  if (!idea) return;

  document.getElementById('btnGenerar').disabled = true;
  document.getElementById('loading').style.display = 'block';
  document.getElementById('resultado').style.display = 'none';

  try {
    const res = await fetch('/.netlify/functions/generarPrompt', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ idea })
    });
    const data = await res.json();

    document.getElementById('promptTexto').textContent = data.prompt;
    document.getElementById('consejoTexto').textContent = data.consejo;
    document.getElementById('resultado').style.display = 'block';

    const diagDiv = document.getElementById('diagrama');
    diagDiv.removeAttribute('data-processed');
    diagDiv.innerHTML = data.mermaid;
    await mermaid.run({ nodes: [diagDiv] });
  } catch (e) {
    alert('Error generando el prompt: ' + e.message);
  } finally {
    document.getElementById('btnGenerar').disabled = false;
    document.getElementById('loading').style.display = 'none';
  }
}

function copiar() {
  const texto = document.getElementById('promptTexto').textContent;
  navigator.clipboard.writeText(texto);
  alert('Prompt copiado');
}
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('/sw.js').catch(function(e){console.log('SW:',e);});
  });
}
</script>
</body>
</html>
